<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Arial,Helvetica,sans-serif"><style>.w{stroke:#222;stroke-width:2;fill:none}.hot{stroke:#b3261e;stroke-width:2;fill:none}.box{fill:#fff;stroke:#222;stroke-width:2}.t{font-size:14px;fill:#222}.s{font-size:12px;fill:#444}.xs{font-size:10px;fill:#666}.b{font-weight:bold}.red{fill:#b3261e}.green{fill:#2e7d32}</style><rect width="1200" height="820" fill="#fafafa"/><text x="600" y="28" text-anchor="middle" class="t b" font-size="19">Daikin S403 → ESP32-C3 Super Mini isolated interface</text><text x="285" y="55" text-anchor="middle" class="t b red">HOT SIDE — mains-referenced</text><text x="900" y="55" text-anchor="middle" class="t b green">COLD SIDE — isolated / ESP32</text><line x1="610" y1="70" x2="610" y2="650" stroke="#777" stroke-width="2" stroke-dasharray="8 6"/><text x="625" y="125" class="xs" transform="rotate(90 625 125)">ISOLATION BARRIER</text><rect x="35" y="85" width="90" height="390" class="box"/><text x="80" y="108" text-anchor="middle" class="t b">S403</text><g class="s"><text x="50" y="145">10  ~320V DC</text><text x="50" y="185">9   NC</text><text x="50" y="225">8   NC</text><text x="50" y="265">7   GND</text><text x="50" y="305">6   GND</text><text x="50" y="345">5   RX</text><text x="50" y="385">4   TX</text><text x="50" y="425">3   NC</text><text x="50" y="445">2   NC</text><text x="50" y="465">1   +14V</text></g><text x="145" y="142" class="s red b">DO NOT CONNECT / TOUCH</text><text x="145" y="158" class="xs red">Pin 10 is the rectified mains bus.</text><text x="145" y="470" class="xs">Pin 1 is next to +14V / ▲ silkscreen.</text><line x1="125" y1="465" x2="185" y2="465" class="w"/><rect x="185" y="455" width="55" height="20" class="box"/><text x="212" y="449" text-anchor="middle" class="xs">F1 200mA</text><line x1="240" y1="465" x2="280" y2="465" class="w"/><polygon points="280,455 280,475 298,465" fill="#222"/><line x1="298" y1="455" x2="298" y2="475" class="w"/><text x="289" y="490" class="xs">1N5819</text><line x1="298" y1="465" x2="340" y2="465" class="w"/><rect x="340" y="425" width="150" height="80" class="box"/><text x="415" y="452" text-anchor="middle" class="t b">Mini560</text><text x="415" y="472" text-anchor="middle" class="s">5V fixed buck</text><text x="348" y="442" class="xs">IN+</text><text x="348" y="495" class="xs">IN−</text><line x1="340" y1="495" x2="310" y2="495" class="hot"/><line x1="310" y1="495" x2="310" y2="520" class="hot"/><line x1="490" y1="445" x2="535" y2="445" class="w"/><text x="495" y="438" class="s">5V_hot</text><line x1="490" y1="485" x2="535" y2="485" class="hot"/><line x1="330" y1="465" x2="330" y2="520" class="w"/><rect x="320" y="520" width="20" height="38" class="box"/><text x="346" y="542" class="xs">SMBJ18A</text><line x1="330" y1="558" x2="330" y2="575" class="hot"/><line x1="180" y1="305" x2="180" y2="335" class="hot"/><line x1="168" y1="337" x2="192" y2="337" class="hot"/><line x1="172" y1="343" x2="188" y2="343" class="hot"/><line x1="176" y1="349" x2="184" y2="349" class="hot"/><text x="195" y="348" class="xs red b">GND_hot</text><line x1="180" y1="495" x2="180" y2="575" class="hot"/><line x1="180" y1="575" x2="330" y2="575" class="hot"/><line x1="125" y1="385" x2="300" y2="385" class="w"/><rect x="210" y="375" width="55" height="20" class="box"/><text x="237" y="370" text-anchor="middle" class="xs">1kΩ</text><text x="275" y="378" class="xs">AC TX → VIA</text><line x1="125" y1="345" x2="160" y2="345" class="w"/><line x1="160" y1="345" x2="160" y2="410" class="w"/><line x1="160" y1="410" x2="300" y2="410" class="w"/><rect x="210" y="400" width="55" height="20" class="box"/><text x="237" y="395" text-anchor="middle" class="xs">1kΩ</text><text x="275" y="393" class="xs">AC RX → VIB</text><rect x="470" y="315" width="170" height="145" class="box"/><text x="555" y="305" text-anchor="middle" class="s b">ADuM1201</text><text x="478" y="340" class="xs">VDD1</text><text x="478" y="385" class="xs">VIA</text><text x="478" y="430" class="xs">VOB</text><text x="628" y="340" text-anchor="end" class="xs">VDD2</text><text x="628" y="385" text-anchor="end" class="xs">VOA</text><text x="628" y="430" text-anchor="end" class="xs">VIB</text><line x1="470" y1="340" x2="445" y2="340" class="w"/><text x="440" y="336" text-anchor="end" class="xs">5V_hot</text><line x1="470" y1="385" x2="300" y2="385" class="w"/><line x1="470" y1="430" x2="300" y2="410" class="w"/><line x1="640" y1="340" x2="760" y2="340" class="w"/><text x="680" y="332" class="s">3.3V</text><line x1="640" y1="385" x2="880" y2="385" class="w"/><text x="760" y="377" class="s">S21 RX → GPIO20</text><line x1="640" y1="430" x2="880" y2="430" class="w"/><text x="760" y="422" class="s">S21 TX ← GPIO21</text><line x1="640" y1="460" x2="680" y2="485" class="w"/><line x1="668" y1="485" x2="692" y2="485" class="w"/><line x1="672" y1="491" x2="688" y2="491" class="w"/><line x1="676" y1="497" x2="684" y2="497" class="w"/><text x="700" y="493" class="xs">GND_iso</text><text x="555" y="520" text-anchor="middle" class="xs">100nF at each ADuM supply pair</text><rect x="500" y="570" width="170" height="70" class="box"/><text x="585" y="595" text-anchor="middle" class="t b">HLK-B0505S-2WR3</text><text x="585" y="615" text-anchor="middle" class="xs">5V → isolated 5V</text><line x1="535" y1="485" x2="535" y2="570" class="w"/><line x1="535" y1="485" x2="500" y2="485" class="w"/><line x1="635" y1="570" x2="760" y2="570" class="w"/><text x="670" y="562" class="s">5V_iso</text><line x1="500" y1="620" x2="460" y2="620" class="hot"/><line x1="460" y1="620" x2="460" y2="575" class="hot"/><line x1="670" y1="620" x2="710" y2="620" class="w"/><line x1="710" y1="620" x2="710" y2="650" class="w"/><line x1="698" y1="652" x2="722" y2="652" class="w"/><line x1="702" y1="658" x2="718" y2="658" class="w"/><line x1="706" y1="664" x2="714" y2="664" class="w"/><rect x="880" y="250" width="260" height="330" class="box"/><text x="1010" y="280" text-anchor="middle" class="t b">ESP32-C3 Super Mini</text><text x="1010" y="298" text-anchor="middle" class="xs">USB-C · 3.3V MCU</text><line x1="880" y1="340" x2="840" y2="340" class="w"/><text x="885" y="333" class="s">3V3</text><line x1="880" y1="385" x2="840" y2="385" class="w"/><text x="885" y="378" class="s">GPIO20 RX</text><line x1="880" y1="430" x2="840" y2="430" class="w"/><text x="885" y="423" class="s">GPIO21 TX</text><line x1="880" y1="520" x2="840" y2="520" class="w"/><line x1="840" y1="520" x2="840" y2="550" class="w"/><line x1="828" y1="552" x2="852" y2="552" class="w"/><line x1="832" y1="558" x2="848" y2="558" class="w"/><line x1="836" y1="564" x2="844" y2="564" class="w"/><text x="860" y="558" class="xs">GND</text><line x1="760" y1="570" x2="760" y2="470" class="w"/><line x1="760" y1="470" x2="840" y2="470" class="w"/><text x="765" y="462" class="s">5V → 5V/VIN</text><text x="1010" y="490" text-anchor="middle" class="xs">Onboard status LED: GPIO8, active-low</text><text x="1010" y="508" text-anchor="middle" class="xs">No external IR hardware</text><text x="1010" y="526" text-anchor="middle" class="xs">No I²C header in this revision</text><rect x="40" y="690" width="1120" height="95" rx="8" fill="#fff" stroke="#aaa"/><text x="55" y="714" class="s b">SAFETY / BUILD NOTES</text><text x="55" y="734" class="xs">• Everything on the HOT side is at mains-referenced potential. Enclose and insulate it. Work de-energized; discharge capacitors before handling.</text><text x="55" y="751" class="xs">• Pin 10 of S403 is ~320V DC: leave it empty. Verify pin 1↔6 ≈14V, pin 4↔6 ≈5V, pin 5↔6 ≈5V before connecting the module.</text><text x="55" y="768" class="xs">• ESP32-C3 UART: GPIO20 = RX, GPIO21 = TX. Disable ESPHome hardware logger so these pins are dedicated to S21.</text></svg>