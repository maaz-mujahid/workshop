<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" font-family="Arial,Helvetica,sans-serif"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#222"/></marker></defs><style>.bg{fill:#fff}.box{fill:#fff;stroke:#222;stroke-width:2}.hot{stroke:#c62828;stroke-width:3;fill:none}.cold{stroke:#1565c0;stroke-width:3;fill:none}.sig{stroke:#2e7d32;stroke-width:2.5;fill:none}.wire{stroke:#222;stroke-width:2;fill:none}.dash{stroke:#777;stroke-width:2;stroke-dasharray:9 7}.title{font-size:27px;font-weight:bold;fill:#111}.side{font-size:20px;font-weight:bold}.h{font-size:18px;font-weight:bold}.t{font-size:16px;fill:#222}.s{font-size:14px;fill:#444}.xs{font-size:12px;fill:#555}.red{fill:#c62828}.blue{fill:#1565c0}.green{fill:#2e7d32}.panel{fill:#fafafa;stroke:#aaa;stroke-width:1.5}</style><rect width="1400" height="1000" class="bg"/><text x="700" y="35" text-anchor="middle" class="title">Daikin S403 → ESP32-C3 Super Mini — Galvanically Isolated Interface</text><text x="350" y="75" text-anchor="middle" class="side red">HOT SIDE — MAINS REFERENCED</text><text x="1050" y="75" text-anchor="middle" class="side green">COLD SIDE — ISOLATED / ESP32</text><line x1="700" y1="95" x2="700" y2="790" class="dash"/><text x="716" y="160" class="xs" transform="rotate(90 716 160)">ISOLATION BARRIER — NO GALVANIC CONNECTION</text><rect x="45" y="115" width="150" height="430" rx="4" class="box"/><text x="120" y="145" text-anchor="middle" class="h">S403</text><text x="120" y="166" text-anchor="middle" class="xs">Daikin indoor unit</text><text x="62" y="205" class="t">10  ~320V DC</text><text x="62" y="245" class="t">9   NC</text><text x="62" y="285" class="t">8   NC</text><text x="62" y="325" class="t">7   GND</text><text x="62" y="365" class="t">6   GND</text><text x="62" y="405" class="t">5   RX (IDU)</text><text x="62" y="445" class="t">4   TX (IDU)</text><text x="62" y="485" class="t">3   NC</text><text x="62" y="515" class="t">2   NC</text><text x="62" y="535" class="t">1   +14V</text><text x="220" y="205" class="h red">⚠ DO NOT CONNECT / TOUCH</text><text x="220" y="228" class="s red">Pin 10 is the rectified mains bus.</text><text x="220" y="248" class="s red">Dangerous voltage may be present.</text><line x1="195" y1="325" x2="250" y2="325" class="hot"/><line x1="250" y1="325" x2="250" y2="345" class="hot"/><line x1="238" y1="347" x2="262" y2="347" class="hot"/><line x1="242" y1="353" x2="258" y2="353" class="hot"/><line x1="246" y1="359" x2="254" y2="359" class="hot"/><text x="268" y="354" class="xs red">GND_HOT (pins 6/7)</text><line x1="195" y1="535" x2="230" y2="535" class="hot"/><rect x="230" y="520" width="70" height="30" class="box"/><text x="265" y="513" text-anchor="middle" class="xs">F1 200mA</text><line x1="300" y1="535" x2="335" y2="535" class="hot"/><polygon points="335,520 335,550 360,535" fill="#222"/><line x1="360" y1="520" x2="360" y2="550" class="wire"/><text x="347" y="568" class="xs">D1 1N5819</text><line x1="360" y1="535" x2="400" y2="535" class="hot"/><rect x="400" y="495" width="190" height="80" rx="5" class="box"/><text x="495" y="525" text-anchor="middle" class="h">U2 Mini560</text><text x="495" y="548" text-anchor="middle" class="s">5V fixed buck</text><text x="410" y="520" class="xs">VIN+</text><text x="410" y="562" class="xs">GND</text><line x1="400" y1="562" x2="250" y2="562" class="hot"/><line x1="250" y1="562" x2="250" y2="359" class="hot"/><line x1="590" y1="525" x2="650" y2="525" class="hot"/><text x="600" y="514" class="s red">5V_HOT</text><line x1="360" y1="535" x2="360" y2="600" class="hot"/><rect x="350" y="600" width="20" height="45" class="box"/><text x="380" y="625" class="xs">D2 SMBJ18A TVS</text><line x1="360" y1="645" x2="360" y2="665" class="hot"/><line x1="250" y1="665" x2="590" y2="665" class="hot"/><line x1="250" y1="562" x2="250" y2="665" class="hot"/><line x1="195" y1="445" x2="260" y2="445" class="wire"/><rect x="260" y="432" width="65" height="26" class="box"/><text x="292" y="425" text-anchor="middle" class="xs">R2 1kΩ</text><line x1="325" y1="445" x2="485" y2="445" class="sig"/><text x="335" y="435" class="xs">S403 TX → ADuM VIA</text><line x1="195" y1="405" x2="225" y2="405" class="wire"/><line x1="225" y1="405" x2="225" y2="475" class="wire"/><rect x="260" y="462" width="65" height="26" class="box"/><text x="292" y="455" text-anchor="middle" class="xs">R1 1kΩ</text><line x1="225" y1="475" x2="260" y2="475" class="wire"/><line x1="325" y1="475" x2="485" y2="475" class="sig"/><text x="335" y="495" class="xs">S403 RX ← ADuM VIB</text><rect x="485" y="250" width="280" height="260" rx="6" class="box"/><text x="625" y="280" text-anchor="middle" class="h">U1 ADuM1201</text><text x="625" y="302" text-anchor="middle" class="s">2-channel digital isolator</text><text x="505" y="345" class="t">VDD1</text><text x="505" y="395" class="t">VIA</text><text x="505" y="445" class="t">VIB</text><text x="505" y="490" class="t">GND1</text><text x="690" y="345" class="t">VDD2</text><text x="690" y="395" class="t">VOA</text><text x="690" y="445" class="t">VOB</text><text x="690" y="490" class="t">GND2</text><line x1="485" y1="345" x2="445" y2="345" class="hot"/><text x="440" y="338" text-anchor="end" class="s red">5V_HOT</text><line x1="485" y1="395" x2="325" y2="445" class="sig"/><line x1="485" y1="445" x2="325" y2="475" class="sig"/><line x1="485" y1="490" x2="440" y2="490" class="hot"/><line x1="440" y1="490" x2="440" y2="665" class="hot"/><line x1="765" y1="345" x2="820" y2="345" class="cold"/><text x="825" y="338" class="s blue">3V3_ISO</text><line x1="765" y1="395" x2="920" y2="395" class="sig"/><text x="790" y="385" class="s green">VOA → ESP GPIO20 RX</text><line x1="765" y1="445" x2="920" y2="445" class="sig"/><text x="790" y="435" class="s green">ESP GPIO21 TX → VOB</text><line x1="765" y1="490" x2="820" y2="490" class="cold"/><line x1="820" y1="490" x2="820" y2="665" class="cold"/><text x="625" y="535" text-anchor="middle" class="xs">100nF decoupling at each ADuM supply pair</text><rect x="480" y="690" width="220" height="90" rx="6" class="box"/><text x="590" y="720" text-anchor="middle" class="h">U4 HLK-B0505S-2WR3</text><text x="590" y="745" text-anchor="middle" class="s">5V_HOT → 5V_ISO</text><text x="490" y="770" class="xs">Input: 5V_HOT</text><text x="610" y="770" class="xs">Output: 5V_ISO</text><line x1="590" y1="665" x2="590" y2="690" class="hot"/><line x1="700" y1="735" x2="755" y2="735" class="cold"/><text x="760" y="730" class="s blue">5V_ISO</text><rect x="780" y="690" width="190" height="90" rx="6" class="box"/><text x="875" y="720" text-anchor="middle" class="h">U5 3.3V LDO</text><text x="875" y="744" text-anchor="middle" class="s">ME6211 / equivalent</text><text x="790" y="770" class="xs">IN 5V_ISO</text><text x="900" y="770" class="xs">OUT 3V3_ISO</text><line x1="755" y1="735" x2="780" y2="735" class="cold"/><line x1="970" y1="735" x2="1010" y2="735" class="cold"/><text x="1015" y="730" class="s blue">3V3_ISO</text><line x1="875" y1="665" x2="875" y2="690" class="cold"/><text x="875" y="810" text-anchor="middle" class="xs">C3/C4: 10µF recommended around LDO · C2: 100µF on 5V_ISO</text><rect x="920" y="250" width="360" height="300" rx="8" class="box"/><text x="1100" y="285" text-anchor="middle" class="h">U3 ESP32-C3 Super Mini</text><text x="1100" y="308" text-anchor="middle" class="s">USB-C · 3.3V MCU</text><line x1="920" y1="345" x2="850" y2="345" class="cold"/><text x="930" y="338" class="s blue">3V3</text><line x1="920" y1="395" x2="920" y2="395" class="sig"/><line x1="920" y1="445" x2="920" y2="445" class="sig"/><text x="935" y="390" class="t">GPIO20 — RX (S21)</text><text x="935" y="440" class="t">GPIO21 — TX (S21)</text><line x1="920" y1="395" x2="765" y2="395" class="sig"/><line x1="920" y1="445" x2="765" y2="445" class="sig"/><line x1="920" y1="500" x2="850" y2="500" class="cold"/><line x1="850" y1="500" x2="850" y2="665" class="cold"/><text x="935" y="495" class="t">GND_ISO</text><line x1="920" y1="535" x2="850" y2="535" class="cold"/><line x1="850" y1="535" x2="850" y2="735" class="cold"/><text x="935" y="530" class="t">5V/VIN from 5V_ISO</text><text x="1100" y="485" text-anchor="middle" class="xs">Onboard status LED: GPIO8, active-low</text><text x="1100" y="505" text-anchor="middle" class="xs">No external IR hardware</text><text x="1100" y="525" text-anchor="middle" class="xs">No external I²C header</text><rect x="45" y="845" width="400" height="115" rx="8" class="panel"/><text x="60" y="870" class="h red">SAFETY / BUILD NOTES</text><text x="60" y="892" class="xs">• HOT side is mains-referenced. Enclose and insulate it.</text><text x="60" y="911" class="xs">• Pin 10 of S403 ≈320V DC — leave empty; never touch.</text><text x="60" y="930" class="xs">• Work de-energized and discharge capacitors before handling.</text><text x="60" y="949" class="xs">• Verify pin 1↔6 ≈14V and signal pins before connecting.</text><rect x="465" y="845" width="430" height="115" rx="8" class="panel"/><text x="480" y="870" class="h blue">POWER SUMMARY</text><text x="480" y="892" class="xs">• S403 pin 1 → fuse/Schottky/TVS → Mini560 → 5V_HOT</text><text x="480" y="911" class="xs">• 5V_HOT powers ADuM hot side and HLK-B0505S input.</text><text x="480" y="930" class="xs">• HLK-B0505S → 5V_ISO → 3.3V LDO → 3V3_ISO.</text><text x="480" y="949" class="xs">• ESP32 uses 5V_ISO at 5V/VIN; ADuM cold side uses 3V3_ISO.</text><rect x="915" y="845" width="365" height="115" rx="8" class="panel"/><text x="930" y="870" class="h green">S21 UART CONNECTION</text><text x="930" y="894" class="xs">S403 pin 4 TX → R2 → ADuM → ESP32 GPIO20 RX</text><text x="930" y="915" class="xs">ESP32 GPIO21 TX → ADuM → R1 → S403 pin 5 RX</text><text x="930" y="936" class="xs">S403 pins 6/7 = GND_HOT only; no cold-side GND bond.</text><text x="930" y="949" class="xs">Disable ESPHome hardware logger for GPIO20/21.</text><text x="700" y="985" text-anchor="middle" class="xs">Rev 3 — corrected power isolation, 3.3V regulation, UART direction, and ESP32-C3 pin mapping</text></svg>