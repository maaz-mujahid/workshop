<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><style>.title{font:700 30px Arial,sans-serif;fill:#111}.subtitle{font:16px Arial,sans-serif;fill:#555}.section{font:700 21px Arial,sans-serif}.label{font:15px Arial,sans-serif;fill:#222}.small{font:13px Arial,sans-serif;fill:#444}.tiny{font:11px Arial,sans-serif;fill:#555}.bold{font-weight:700}.hotText{fill:#b3261e}.coldText{fill:#176b2c}.blueText{fill:#075bb5}.warn{fill:#fff1f0;stroke:#c62828;stroke-width:2}.box{fill:#fff;stroke:#222;stroke-width:2}.hotbox{fill:#fffafa;stroke:#b3261e;stroke-width:2}.coldbox{fill:#f8fff9;stroke:#176b2c;stroke-width:2}.power{stroke:#d97706;stroke-width:3;fill:none}.hotwire{stroke:#b3261e;stroke-width:3;fill:none}.signal{stroke:#075bb5;stroke-width:3;fill:none}.ground{stroke:#555;stroke-width:2.5;fill:none}.iso{stroke:#777;stroke-width:3;stroke-dasharray:10 8}.pin{font:12px Arial,sans-serif;fill:#666}</style></defs><rect width="1600" height="1000" fill="#fafafa"/><text x="800" y="42" text-anchor="middle" class="title">Daikin S403 → ESP32-C3 Super Mini — Galvanically Isolated S21 Interface</text><text x="800" y="70" text-anchor="middle" class="subtitle">Reference design for the standard 10-pin S403 connector. Verify the actual indoor-unit pinout and voltages before connection.</text><rect x="30" y="95" width="735" height="585" rx="12" class="hotbox"/><rect x="865" y="95" width="705" height="585" rx="12" class="coldbox"/><text x="397" y="128" text-anchor="middle" class="section hotText">HOT SIDE — S403 / MAINS-REFERENCED</text><text x="1217" y="128" text-anchor="middle" class="section coldText">COLD SIDE — ISOLATED / ESP32-C3</text><line x1="815" y1="105" x2="815" y2="680" class="iso"/><text x="830" y="380" transform="rotate(90 830 380)" class="small bold">GALVANIC ISOLATION BARRIER — NO GND CONNECTION ACROSS THIS LINE</text><rect x="65" y="165" width="150" height="445" class="box"/><text x="140" y="194" text-anchor="middle" class="section">S403</text><text x="140" y="216" text-anchor="middle" class="small">10-pin service connector</text><g class="label bold"><text x="85" y="255">10</text><text x="85" y="295">9</text><text x="85" y="335">8</text><text x="85" y="375">7</text><text x="85" y="415">6</text><text x="85" y="455">5</text><text x="85" y="495">4</text><text x="85" y="535">3</text><text x="85" y="575">2</text><text x="85" y="595">1</text></g><g class="label"><text x="115" y="255">~320 VDC — DANGER</text><text x="115" y="295">NC</text><text x="115" y="335">NC</text><text x="115" y="375">GND</text><text x="115" y="415">GND</text><text x="115" y="455">RX — to AC</text><text x="115" y="495">TX — from AC</text><text x="115" y="535">NC / JEM-A*</text><text x="115" y="575">NC / JEM-A*</text><text x="115" y="595">+14 VDC</text></g><text x="225" y="248" class="small hotText bold">LEAVE PIN 10 EMPTY</text><text x="225" y="267" class="tiny hotText">Do not touch. Rectified mains bus.</text><text x="225" y="455" class="tiny hotText">Pin 5 is AC receive input.</text><text x="225" y="495" class="tiny hotText">Pin 4 is AC transmit output.</text><text x="225" y="585" class="tiny hotText">Pin 1 is the low-voltage supply.</text><line x1="215" y1="375" x2="275" y2="375" class="ground"/><line x1="215" y1="415" x2="275" y2="415" class="ground"/><line x1="275" y1="375" x2="275" y2="415" class="ground"/><line x1="275" y1="415" x2="275" y2="640" class="ground"/><line x1="263" y1="640" x2="287" y2="640" class="ground"/><line x1="267" y1="647" x2="283" y2="647" class="ground"/><line x1="271" y1="654" x2="279" y2="654" class="ground"/><text x="292" y="640" class="small hotText bold">GND_HOT</text><line x1="215" y1="595" x2="285" y2="595" class="power"/><rect x="285" y="580" width="70" height="30" class="box"/><text x="320" y="574" text-anchor="middle" class="tiny bold">F1</text><text x="320" y="600" text-anchor="middle" class="tiny">200 mA PTC</text><line x1="355" y1="595" x2="395" y2="595" class="power"/><polygon points="395,580 395,610 425,595" fill="#d97706"/><line x1="425" y1="580" x2="425" y2="610" stroke="#d97706" stroke-width="3"/><text x="410" y="626" text-anchor="middle" class="tiny">D1 1N5819</text><line x1="425" y1="595" x2="470" y2="595" class="power"/><rect x="470" y="550" width="170" height="90" class="box"/><text x="555" y="580" text-anchor="middle" class="section" font-size="17">Mini560</text><text x="555" y="603" text-anchor="middle" class="small">14 VDC → 5 VDC buck</text><text x="480" y="575" class="tiny">VIN+</text><text x="480" y="625" class="tiny">GND</text><line x1="470" y1="625" x2="400" y2="625" class="ground"/><line x1="400" y1="625" x2="400" y2="640" class="ground"/><line x1="640" y1="570" x2="720" y2="570" class="power"/><text x="648" y="560" class="small hotText bold">5V_HOT</text><rect x="680" y="585" width="35" height="60" class="box"/><text x="698" y="610" text-anchor="middle" class="tiny">C1</text><text x="698" y="628" text-anchor="middle" class="tiny">470µF</text><line x1="698" y1="570" x2="698" y2="585" class="power"/><line x1="698" y1="645" x2="698" y2="654" class="ground"/><line x1="698" y1="654" x2="275" y2="654" class="ground"/><line x1="450" y1="595" x2="450" y2="650" class="hotwire"/><rect x="435" y="650" width="30" height="55" class="box"/><text x="450" y="670" text-anchor="middle" class="tiny">D2</text><text x="450" y="688" text-anchor="middle" class="tiny">SMBJ18A</text><line x1="450" y1="705" x2="450" y2="715" class="hotwire"/><line x1="450" y1="715" x2="275" y2="715" class="ground"/><rect x="585" y="190" width="180" height="275" class="box"/><text x="675" y="220" text-anchor="middle" class="section" font-size="18">U1 — ADuM1201ARZ</text><text x="675" y="241" text-anchor="middle" class="small">2-channel digital isolator</text><text x="600" y="275" class="pin">1 VDD1 = 5V_HOT</text><text x="600" y="305" class="pin">7 VIA = S403 TX input</text><text x="600" y="335" class="pin">3 VIB = ESP TX input</text><text x="600" y="365" class="pin">4 GND1 = GND_HOT</text><text x="600" y="405" class="pin">8 VDD2 = 3V3_ISO</text><text x="600" y="435" class="pin">2 VOA = ESP RX output</text><text x="600" y="465" class="pin">6 VOB = S403 RX output</text><text x="600" y="495" class="pin">5 GND2 = GND_ISO</text><rect x="495" y="205" width="70" height="45" class="box"/><text x="530" y="225" text-anchor="middle" class="tiny">C3 100nF</text><text x="530" y="241" text-anchor="middle" class="tiny">VDD1↔GND1</text><rect x="785" y="205" width="70" height="45" class="box"/><text x="820" y="225" text-anchor="middle" class="tiny">C4 100nF</text><text x="820" y="241" text-anchor="middle" class="tiny">VDD2↔GND2</text><line x1="215" y1="495" x2="500" y2="495" class="signal"/><rect x="315" y="480" width="60" height="30" class="box"/><text x="345" y="500" text-anchor="middle" class="tiny">R1 1kΩ</text><line x1="500" y1="495" x2="500" y2="305" class="signal"/><line x1="500" y1="305" x2="585" y2="305" class="signal"/><text x="385" y="472" class="tiny blueText">S403 pin 4 TX → ADuM VIA</text><line x1="765" y1="465" x2="785" y2="465" class="signal"/><line x1="785" y1="465" x2="785" y2="525" class="signal"/><line x1="785" y1="525" x2="375" y2="525" class="signal"/><rect x="315" y="510" width="60" height="30" class="box"/><text x="345" y="530" text-anchor="middle" class="tiny">R2 1kΩ</text><line x1="315" y1="525" x2="215" y2="525" class="signal"/><text x="400" y="550" class="tiny blueText">ADuM VOB → S403 pin 5 RX</text><line x1="720" y1="570" x2="720" y2="275" class="power"/><line x1="720" y1="275" x2="765" y2="275" class="power"/><text x="720" y="265" class="tiny hotText">5V_HOT → pin 1 VDD1</text><line x1="765" y1="405" x2="865" y2="405" class="power"/><text x="775" y="395" class="tiny coldText">3V3_ISO</text><line x1="765" y1="495" x2="830" y2="495" class="ground"/><line x1="830" y1="495" x2="830" y2="640" class="ground"/><line x1="830" y1="640" x2="1000" y2="640" class="ground"/><rect x="900" y="160" width="220" height="95" class="box"/><text x="1010" y="190" text-anchor="middle" class="section" font-size="17">U2 — HLK-B0505S-2WR3</text><text x="1010" y="215" text-anchor="middle" class="small">5V_HOT → isolated 5V</text><text x="1010" y="237" text-anchor="middle" class="tiny">1500 VDC isolation rating</text><line x1="720" y1="570" x2="900" y2="570" class="power"/><text x="780" y="560" class="tiny hotText">5V_HOT</text><line x1="900" y1="205" x2="865" y2="205" class="power"/><line x1="1120" y1="205" x2="1165" y2="205" class="power"/><text x="1130" y="195" class="tiny coldText">5V_ISO</text><rect x="1165" y="180" width="55" height="70" class="box"/><text x="1192" y="205" text-anchor="middle" class="tiny">C2</text><text x="1192" y="222" text-anchor="middle" class="tiny">470µF</text><line x1="1192" y1="250" x2="1192" y2="275" class="ground"/><rect x="1260" y="150" width="250" height="330" class="box"/><text x="1385" y="185" text-anchor="middle" class="section" font-size="18">U3 — ESP32-C3 Super Mini</text><text x="1385" y="210" text-anchor="middle" class="small">3.3 V GPIO · Wi-Fi + BLE</text><text x="1280" y="250" class="label">5V pin ← 5V_ISO</text><text x="1280" y="290" class="label">3V3 pin → 3V3_ISO</text><text x="1280" y="330" class="label">GPIO20 / U0RXD ← S403 TX</text><text x="1280" y="370" class="label">GPIO21 / U0TXD → S403 RX</text><text x="1280" y="410" class="label">GND → GND_ISO</text><text x="1280" y="450" class="tiny">Disable ESPHome hardware logger:</text><text x="1280" y="466" class="tiny bold">logger: baud_rate: 0</text><line x1="1165" y1="205" x2="1225" y2="205" class="power"/><line x1="1225" y1="205" x2="1225" y2="250" class="power"/><line x1="1225" y1="250" x2="1260" y2="250" class="power"/><line x1="1385" y1="290" x2="1385" y2="275" class="signal"/><line x1="1385" y1="275" x2="850" y2="275" class="signal"/><line x1="850" y1="275" x2="850" y2="405" class="signal"/><line x1="850" y1="405" x2="765" y2="405" class="signal"/><line x1="1385" y1="330" x2="1385" y2="525" class="signal"/><line x1="1385" y1="525" x2="785" y2="525" class="signal"/><line x1="1385" y1="410" x2="1385" y2="640" class="ground"/><line x1="1385" y1="640" x2="1000" y2="640" class="ground"/><rect x="30" y="715" width="740" height="245" rx="10" class="warn"/><text x="55" y="750" class="section hotText" font-size="18">SAFETY — S403 HOT SIDE</text><text x="55" y="780" class="label">• Pin 10 can be ~320 VDC. Leave it completely unconnected and insulated.</text><text x="55" y="808" class="label">• Pins 6 and 7 are GND_HOT. They are NOT safe/isolated ground.</text><text x="55" y="836" class="label">• Power the interface only from S403 pin 1 (+14 VDC) and pin 6/7 GND.</text><text x="55" y="864" class="label">• Verify pin 1↔6 ≈ 14 VDC and identify pins 4/5 before connecting.</text><text x="55" y="892" class="label">• Work de-energized. The S403 connector is not a SELV-isolated port.</text><text x="55" y="920" class="tiny">* Pins 2/3 are shown as unused here; some variants expose JEM-A functions there.</text><rect x="805" y="715" width="765" height="245" rx="10" fill="#f7fbff" stroke="#175cb7" stroke-width="2"/><text x="830" y="750" class="section blueText" font-size="18">DESIGN CHECK — SIGNAL & POWER DOMAINS</text><text x="830" y="780" class="label">• S403 pin 4 (TX from AC) → R1 → ADuM1201 VIA (pin 7) → VOA (pin 2) → ESP32 GPIO20 RX.</text><text x="830" y="808" class="label">• ESP32 GPIO21 TX → ADuM1201 VIB (pin 3) → VOB (pin 6) → R2 → S403 pin 5 RX.</text><text x="830" y="836" class="label">• ADuM1201 side 1 = 5V_HOT / GND_HOT; side 2 = 3V3_ISO / GND_ISO.</text><text x="830" y="864" class="label">• HLK-B0505S creates 5V_ISO from 5V_HOT; ESP32 Super Mini onboard regulator makes 3V3_ISO.</text><text x="830" y="892" class="label">• No conductive connection crosses the isolation barrier; only the ADuM magnetic isolation and DC/DC isolation cross it.</text><text x="830" y="920" class="label">• S21 protocol: 2400 baud, 8 data bits, even parity, 2 stop bits (model compatibility can vary).</text><text x="830" y="945" class="tiny">Reference: S403 pinout and protocol information from Faikin / Daikin reverse-engineering documentation; verify against the exact indoor unit.</text><text x="800" y="988" text-anchor="middle" class="tiny">REV 4 — corrected S403 pin direction, ADuM1201 pin mapping, isolated power domains, and 5V/3V3 rails</text></svg>