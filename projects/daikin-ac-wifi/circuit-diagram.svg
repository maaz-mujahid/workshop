<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><style>.t{font:700 30px Arial;fill:#111}.st{font:700 20px Arial}.l{font:15px Arial;fill:#222}.s{font:13px Arial;fill:#555}.xs{font:11px Arial;fill:#555}.b{font-weight:700}.hot{fill:#b3261e}.cold{fill:#176b2c}.blue{fill:#075bb5}.box{fill:#fff;stroke:#222;stroke-width:2}.hb{fill:#fffafa;stroke:#b3261e;stroke-width:2}.cb{fill:#f8fff9;stroke:#176b2c;stroke-width:2}.w{fill:none;stroke:#222;stroke-width:2}.p{fill:none;stroke:#d97706;stroke-width:3}.sig{fill:none;stroke:#075bb5;stroke-width:3}.g{fill:none;stroke:#555;stroke-width:2.5}.iso{stroke:#777;stroke-width:3;stroke-dasharray:10 8}.panel{fill:#fafafa;stroke:#aaa;stroke-width:1.5}.warn{fill:#fff1f0;stroke:#c62828;stroke-width:2}</style><rect width="1600" height="1000" fill="#fafafa"/><text x="800" y="42" text-anchor="middle" class="t">Daikin S403 → ESP32-C3 Super Mini — Isolated S21 Interface</text><text x="800" y="68" text-anchor="middle" class="s">Standard 10-pin S403 reference. Verify the exact indoor-unit pinout and measured voltages before connection.</text><rect x="25" y="95" width="735" height="570" rx="12" class="hb"/><rect x="875" y="95" width="700" height="570" rx="12" class="cb"/><text x="392" y="128" text-anchor="middle" class="st hot">HOT SIDE — MAINS-REFERENCED</text><text x="1225" y="128" text-anchor="middle" class="st cold">COLD SIDE — GALVANICALLY ISOLATED</text><line x1="815" y1="105" x2="815" y2="665" class="iso"/><text x="830" y="380" transform="rotate(90 830 380)" class="s b">ISOLATION BARRIER — NO COMMON GROUND</text><rect x="55" y="165" width="165" height="430" class="box"/><text x="137" y="195" text-anchor="middle" class="st">S403</text><text x="137" y="216" text-anchor="middle" class="s">10-pin connector</text><g class="l b"><text x="75" y="255">10</text><text x="75" y="295">9</text><text x="75" y="335">8</text><text x="75" y="375">7</text><text x="75" y="415">6</text><text x="75" y="455">5</text><text x="75" y="495">4</text><text x="75" y="535">3</text><text x="75" y="575">2</text><text x="75" y="595">1</text></g><g class="l"><text x="105" y="255">~320 VDC — DANGER</text><text x="105" y="295">NC</text><text x="105" y="335">NC</text><text x="105" y="375">GND_HOT</text><text x="105" y="415">GND_HOT</text><text x="105" y="455">RX at IDU</text><text x="105" y="495">TX from IDU</text><text x="105" y="535">unused*</text><text x="105" y="575">unused*</text><text x="105" y="595">+14 VDC</text></g><text x="245" y="250" class="l hot b">⚠ PIN 10: LEAVE EMPTY</text><text x="245" y="270" class="s hot">Rectified mains bus. Do not touch.</text><text x="245" y="450" class="xs hot">Pin 4 = AC transmits → controller RX</text><text x="245" y="490" class="xs hot">Pin 5 = AC receives ← controller TX</text><line x1="220" y1="375" x2="280" y2="375" class="g"/><line x1="220" y1="415" x2="280" y2="415" class="g"/><line x1="280" y1="375" x2="280" y2="640" class="g"/><line x1="268" y1="640" x2="292" y2="640" class="g"/><line x1="272" y1="647" x2="288" y2="647" class="g"/><line x1="276" y1="654" x2="284" y2="654" class="g"/><text x="300" y="644" class="s hot b">GND_HOT</text><line x1="220" y1="595" x2="290" y2="595" class="p"/><rect x="290" y="580" width="80" height="30" class="box"/><text x="330" y="575" text-anchor="middle" class="xs b">F1 200mA PTC</text><line x1="370" y1="595" x2="410" y2="595" class="p"/><polygon points="410,580 410,610 440,595" fill="#d97706"/><line x1="440" y1="580" x2="440" y2="610" stroke="#d97706" stroke-width="3"/><text x="425" y="628" text-anchor="middle" class="xs">D1 1N5819</text><line x1="440" y1="595" x2="480" y2="595" class="p"/><rect x="480" y="550" width="190" height="90" class="box"/><text x="575" y="580" text-anchor="middle" class="st" font-size="17">U2 Mini560</text><text x="575" y="603" text-anchor="middle" class="s">14 VDC → 5 VDC buck</text><text x="480" y="570" class="xs">VIN+</text><text x="480" y="625" class="xs">GND</text><line x1="480" y1="625" x2="280" y2="625" class="g"/><line x1="670" y1="570" x2="730" y2="570" class="p"/><text x="680" y="558" class="s hot b">NET: 5V_HOT</text><rect x="690" y="585" width="40" height="60" class="box"/><text x="710" y="610" text-anchor="middle" class="xs">C1</text><text x="710" y="628" text-anchor="middle" class="xs">470µF</text><line x1="710" y1="570" x2="710" y2="585" class="p"/><line x1="710" y1="645" x2="710" y2="654" class="g"/><line x1="710" y1="654" x2="280" y2="654" class="g"/><line x1="460" y1="595" x2="460" y2="650" class="w"/><rect x="442" y="650" width="36" height="55" class="box"/><text x="460" y="670" text-anchor="middle" class="xs">D2</text><text x="460" y="688" text-anchor="middle" class="xs">SMBJ18A</text><line x1="460" y1="705" x2="460" y2="715" class="g"/><line x1="460" y1="715" x2="280" y2="715" class="g"/><rect x="535" y="185" width="225" height="285" class="box"/><text x="647" y="215" text-anchor="middle" class="st" font-size="18">U1 — ADuM1201ARZ</text><text x="647" y="237" text-anchor="middle" class="s">Dual-channel digital isolator</text><text x="550" y="275" class="xs">1 VDD1 = 5V_HOT</text><text x="550" y="305" class="xs">7 VIA = S403 pin 4 TX</text><text x="550" y="335" class="xs">3 VIB = ESP GPIO21 TX</text><text x="550" y="365" class="xs">4 GND1 = GND_HOT</text><text x="550" y="405" class="xs">8 VDD2 = ESP 3V3</text><text x="550" y="435" class="xs">2 VOA = ESP GPIO20 RX</text><text x="550" y="465" class="xs">6 VOB = S403 pin 5 RX</text><text x="550" y="495" class="xs">5 GND2 = GND_ISO</text><line x1="220" y1="495" x2="300" y2="495" class="sig"/><rect x="300" y="480" width="65" height="30" class="box"/><text x="332" y="500" text-anchor="middle" class="xs">R1 1kΩ</text><line x1="365" y1="495" x2="500" y2="495" class="sig"/><line x1="500" y1="495" x2="500" y2="305" class="sig"/><line x1="500" y1="305" x2="535" y2="305" class="sig"/><text x="370" y="470" class="xs blue">S403 pin 4 TX → ADuM VIA (pin 7)</text><line x1="760" y1="465" x2="800" y2="465" class="sig"/><line x1="800" y1="465" x2="800" y2="525" class="sig"/><line x1="800" y1="525" x2="365" y2="525" class="sig"/><rect x="300" y="510" width="65" height="30" class="box"/><text x="332" y="530" text-anchor="middle" class="xs">R2 1kΩ</text><line x1="300" y1="525" x2="220" y2="525" class="sig"/><text x="400" y="550" class="xs blue">ADuM VOB (pin 6) → R2 → S403 pin 5 RX</text><line x1="730" y1="570" x2="730" y2="275" class="p"/><line x1="730" y1="275" x2="760" y2="275" class="p"/><line x1="760" y1="405" x2="850" y2="405" class="sig"/><text x="770" y="395" class="s cold b">NET: 3V3_ISO</text><line x1="760" y1="495" x2="850" y2="495" class="g"/><text x="770" y="485" class="s cold b">NET: GND_ISO</text><rect x="455" y="220" width="65" height="40" class="box"/><text x="487" y="240" text-anchor="middle" class="xs">C3 100nF</text><text x="487" y="253" text-anchor="middle" class="xs">VDD1↔GND1</text><rect x="775" y="220" width="65" height="40" class="box"/><text x="807" y="240" text-anchor="middle" class="xs">C4 100nF</text><text x="807" y="253" text-anchor="middle" class="xs">VDD2↔GND2</text><rect x="900" y="170" width="250" height="100" class="box"/><text x="1025" y="200" text-anchor="middle" class="st" font-size="17">U4 HLK-B0505S-2WR3</text><text x="1025" y="225" text-anchor="middle" class="s">5V_HOT → isolated 5V</text><text x="1025" y="247" text-anchor="middle" class="xs">1500 VDC isolation rating</text><text x="900" y="290" class="xs hot">IN+ = NET 5V_HOT</text><text x="1050" y="290" class="xs cold">OUT+ = NET 5V_ISO</text><text x="900" y="308" class="xs hot">IN− = NET GND_HOT</text><text x="1050" y="308" class="xs cold">OUT− = NET GND_ISO</text><rect x="1165" y="190" width="55" height="65" class="box"/><text x="1192" y="215" text-anchor="middle" class="xs">C2</text><text x="1192" y="233" text-anchor="middle" class="xs">470µF</text><text x="1192" y="248" text-anchor="middle" class="xs">5V_ISO</text><text x="1250" y="300" class="s cold b">NET: 5V_ISO</text><rect x="900" y="350" width="500" height="240" class="box"/><text x="1150" y="385" text-anchor="middle" class="st" font-size="18">U3 — ESP32-C3 Super Mini</text><text x="1150" y="410" text-anchor="middle" class="s">5V pin from 5V_ISO; onboard regulator provides 3.3V</text><text x="930" y="450" class="l">GPIO20 / U0RXD ← ADuM VOA (S403 TX)</text><text x="930" y="485" class="l">GPIO21 / U0TXD → ADuM VIB (S403 RX)</text><text x="930" y="520" class="l">3V3 → ADuM VDD2 (3V3_ISO)</text><text x="930" y="555" class="l">GND → GND_ISO</text><text x="930" y="580" class="xs">Disable ESPHome hardware logger: logger: baud_rate: 0</text><line x1="850" y1="405" x2="900" y2="405" class="sig"/><line x1="900" y1="450" x2="800" y2="450" class="sig"/><line x1="900" y1="485" x2="800" y2="485" class="sig"/><line x1="850" y1="495" x2="900" y2="495" class="g"/><line x1="1250" y1="300" x2="1250" y2="350" class="p"/><line x1="1250" y1="350" x2="1400" y2="350" class="p"/><text x="1260" y="340" class="s cold b">5V_ISO → 5V/VIN</text><rect x="25" y="740" width="735" height="225" rx="10" class="warn"/><text x="50" y="775" class="st hot" font-size="18">SAFETY</text><text x="50" y="805" class="l">• S403 pin 10 can be ~320 VDC. Leave it empty, insulated, and untouched.</text><text x="50" y="833" class="l">• Pins 6/7 are GND_HOT, not protective earth and not isolated.</text><text x="50" y="861" class="l">• Work de-energized; discharge capacitors before handling.</text><text x="50" y="889" class="l">• Verify pin 1↔6 ≈14 VDC and identify pins 4/5 before connection.</text><text x="50" y="917" class="s">• Pins 2/3 are not used by this interface; some variants use them for JEM-A.</text><text x="50" y="942" class="xs">S403 is a non-isolated service port. Keep the hot-side circuit enclosed inside the AC.</text><rect x="800" y="740" width="775" height="225" rx="10" class="panel"/><text x="825" y="775" class="st blue" font-size="18">ELECTRICAL / PROTOCOL CHECK</text><text x="825" y="805" class="l">• S403 pin 4 (TX from IDU) → 1kΩ → ADuM VIA pin 7 → VOA pin 2 → ESP32 GPIO20 RX.</text><text x="825" y="833" class="l">• ESP32 GPIO21 TX → ADuM VIB pin 3 → VOB pin 6 → 1kΩ → S403 pin 5 RX.</text><text x="825" y="861" class="l">• ADuM1201 side 1: 5V_HOT / GND_HOT. Side 2: ESP32 3V3 / GND_ISO.</text><text x="825" y="889" class="l">• HLK-B0505S provides 5V_ISO; ESP32-C3 Super Mini onboard regulator provides 3V3_ISO.</text><text x="825" y="917" class="l">• S21 serial: 2400 baud, 8 data bits, even parity, 2 stop bits.</text><text x="825" y="945" class="xs">Reference: Faikin / S21 reverse-engineering documentation and Analog Devices ADuM1201 datasheet. Exact Daikin model behavior can vary.</text><text x="800" y="990" text-anchor="middle" class="xs">REV 6 — corrected S403 directions, exact ADuM1201 pin mapping, isolated power domains, and explicit net names</text></svg>