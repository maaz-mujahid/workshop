<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Arial,Helvetica,sans-serif"><style>.box{fill:#f7f7f7;stroke:#333;stroke-width:2}.m{stroke:#c62828;stroke-width:3;fill:none}.v{stroke:#e07b00;stroke-width:3;fill:none}.g{stroke:#666;stroke-width:3;fill:none}.s{stroke:#2e7d32;stroke-width:2.5;fill:none}.t{font-size:20px;font-weight:bold;fill:#111}.h{font-size:16px;font-weight:bold;fill:#075b8e}.l{font-size:14px;fill:#222}.n{font-size:12px;fill:#666;font-style:italic}</style>
<text x="30" y="35" class="t">Presence Lighting — ESP32-C3 Super Mini · Circuit Diagram</text><text x="30" y="58" class="n">Both controller nodes use the same ESP32-C3 Super Mini platform.</text>
<text x="30" y="100" class="h">NODE 1 — CEILING: ESP32-C3 + LD2410C + 2-CHANNEL RELAY</text>
<rect x="40" y="130" width="190" height="80" rx="6" class="box"/><text x="60" y="160" class="l">HLK-PM05</text><text x="60" y="184" class="l">230 VAC → 5 V</text>
<path class="v" d="M230 155 H360"/><path class="g" d="M230 190 H360"/><text x="250" y="148" class="l">+5V</text><text x="250" y="210" class="l">GND</text>
<rect x="360" y="120" width="300" height="250" rx="8" class="box"/><text x="390" y="155" class="t" font-size="17">ESP32-C3 Super Mini</text><text x="390" y="180" class="l">ESPHome / Home Assistant</text><text x="390" y="220" class="l">GPIO20 — UART RX</text><text x="390" y="250" class="l">GPIO21 — UART TX</text><text x="390" y="290" class="l">GPIO4 — Relay IN1</text><text x="390" y="320" class="l">GPIO5 — Relay IN2</text><text x="390" y="350" class="l">5V/VBUS + GND</text>
<path class="v" d="M360 155 H330 V100"/><path class="g" d="M360 190 H315 V100"/><path class="s" d="M660 220 H790"/><path class="s" d="M660 250 H790"/>
<rect x="790" y="130" width="260" height="180" rx="8" class="box"/><text x="820" y="165" class="t" font-size="17">HLK-LD2410C</text><text x="820" y="190" class="l">24 GHz mmWave radar</text><text x="820" y="230" class="l">TX → GPIO20 (RX)</text><text x="820" y="260" class="l">RX ← GPIO21 (TX)</text><text x="820" y="290" class="l">5V + GND</text>
<rect x="360" y="420" width="300" height="180" rx="8" class="box"/><text x="390" y="455" class="t" font-size="17">2-CH Relay Board</text><text x="390" y="485" class="l">IN1 ← GPIO4 (warm)</text><text x="390" y="515" class="l">IN2 ← GPIO5 (cool)</text><text x="390" y="545" class="l">VCC = 5V · GND = GND</text><text x="390" y="575" class="n">Relays normally open; default OFF.</text>
<path class="s" d="M520 370 V420"/>
<rect x="760" y="410" width="190" height="70" rx="6" class="box"/><text x="785" y="440" class="l">4 × WARM bulbs</text><text x="785" y="462" class="n">Relay 1 NO</text><rect x="760" y="520" width="190" height="70" rx="6" class="box"/><text x="785" y="550" class="l">2 × COOL bulbs</text><text x="785" y="572" class="n">Relay 2 NO</text><path class="m" d="M660 470 H760"/><path class="m" d="M660 560 H760"/>
<text x="30" y="650" class="h">NODE 2 — DESK: ESP32-C3 + AO3400 + BLUETOOTH LED STRIP</text>
<rect x="40" y="690" width="180" height="90" rx="6" class="box"/><text x="65" y="725" class="l">USB adapter</text><text x="65" y="750" class="l">5V + GND</text>
<rect x="300" y="675" width="270" height="120" rx="8" class="box"/><text x="325" y="710" class="t" font-size="17">ESP32-C3 Super Mini</text><text x="325" y="740" class="l">GPIO4 → 100Ω → Gate</text><text x="325" y="765" class="l">GND + 5V from USB</text>
<rect x="650" y="675" width="190" height="120" rx="8" class="box"/><text x="675" y="710" class="t" font-size="17">AO3400</text><text x="675" y="740" class="l">N-MOSFET low-side</text><text x="675" y="765" class="l">100kΩ Gate → GND</text>
<rect x="930" y="690" width="220" height="90" rx="6" class="box"/><text x="955" y="725" class="l">Bluetooth LED strip</text><text x="955" y="750" class="l">USB power switched</text><path class="v" d="M220 710 H930"/><path class="g" d="M220 760 H300"/><path class="s" d="M570 735 H650"/><path class="g" d="M840 755 H930"/>
<text x="30" y="845" class="n">Safety: mains wiring must be de-energized and verified dead before work. Use proper enclosure, fuse and mains-rated connections.</text></svg>